  /v1/auth/sessions/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /v1/me:
    $ref: './paths/profile.yaml#/me'
  /v1/me/preferences:
    $ref: './paths/profile.yaml#/preferences'
  /v1/me/identity/apple:
    $ref: './paths/profile.yaml#/appleIdentity'
  /v1/discover/matches:
    $ref: './paths/discover.yaml#/matches'
  /v1/destinations/{destinationId}:
    $ref: './paths/intelligence.yaml#/destination'
  /v1/destinations/{destinationId}/media:
    $ref: './paths/intelligence.yaml#/media'
  /v1/trips:
    $ref: './paths/trips.yaml#/collection'
  /v1/trips/{tripId}:
    $ref: './paths/trips.yaml#/item'
  /v1/trips/{tripId}/itinerary:
    $ref: './paths/itinerary.yaml#/read'
  /v1/trips/{tripId}/itinerary/generate:
    $ref: './paths/itinerary.yaml#/generate'
  /v1/trips/{tripId}/itinerary/items/{itemId}:
    $ref: './paths/itinerary.yaml#/item'
  /v1/trips/{tripId}/budget:
    $ref: './paths/itinerary.yaml#/budget'
  /v1/trips/{tripId}/nearby/search:
    $ref: './paths/itinerary.yaml#/nearby'
  /v1/trips/{tripId}/active:
    $ref: './paths/runtime.yaml#/active'
  /v1/trips/{tripId}/alerts:
    $ref: './paths/runtime.yaml#/alerts'
  /v1/trips/{tripId}/alerts/{alertId}:
    $ref: './paths/runtime.yaml#/alert'
  /v1/trips/{tripId}/replan:
    $ref: './paths/runtime.yaml#/replan'
  /v1/trips/{tripId}/replan/{proposalId}/apply:
    $ref: './paths/runtime.yaml#/apply'
  /v1/trips/{tripId}/translate:
    $ref: './paths/runtime.yaml#/translate'
  /v1/trips/{tripId}/phrases:
    $ref: './paths/runtime.yaml#/phrases'
  /v1/trips/{tripId}/offline-pack:
    $ref: './paths/runtime.yaml#/offline'
  /v1/trips/{tripId}/flights/search:
    $ref: './paths/commerce.yaml#/flights'
  /v1/trips/{tripId}/stays/search:
    $ref: './paths/commerce.yaml#/stays'
  /v1/trips/{tripId}/activities/search:
    $ref: './paths/commerce.yaml#/activities'
  /v1/commerce/handoffs:
    $ref: './paths/commerce.yaml#/handoffs'
  /v1/me/personalization:
    $ref: './paths/personalization.yaml#/settings'
  /v1/me/personalization/insights:
    $ref: './paths/personalization.yaml#/insights'
  /v1/me/personalization/insights/{insightId}:
    $ref: './paths/personalization.yaml#/insight'
  /v1/trips/{tripId}/feedback:
    $ref: './paths/personalization.yaml#/feedback'
  /v1/me/price-watches:
    $ref: './paths/commerce.yaml#/watches'
  /v1/me/price-watches/{watchId}:
    $ref: './paths/commerce.yaml#/watch'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Sign in with Apple identity token for the configured NUVRO audience. The backend
        verifies signature, issuer, audience and expiry against Apple's published keys, then
        resolves or enrols the NUVRO account behind that identity. Development builds may
        accept an explicitly configured development credential instead; see
        docs/api/authentication.md.
