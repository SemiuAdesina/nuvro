openapi: 3.1.0
info:
  title: NUVRO API
  version: 1.0.0
  description: Released operations. Every product operation requires a verified NUVRO principal.
security:
  - bearerAuth: []
paths:
  /health/live:
    $ref: './paths/system.yaml#/live'
  /health/ready:
    $ref: './paths/system.yaml#/ready'
  /v1/auth/sessions:
