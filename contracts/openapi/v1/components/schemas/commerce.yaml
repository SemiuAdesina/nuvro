OfferFreshness:
  type: string
  enum: [live, recent, stale, expired]
CommerceDisclosure:
  type: object
  additionalProperties: false
  required: [code, partner]
  description: Commercial relationship the client must show; never hidden
  properties:
    code:
      type: string
      enum: [affiliate.eligible_booking]
    partner:
      type: string
OfferBase:
  type: object
  additionalProperties: false
  required: [id, partner, product, title, price, available, freshness, observedAt, reasons, rank]
  description: Traveller-facing offer; commission is never part of this contract
  properties:
    id:
      type: string
      description: Opaque NUVRO offer reference, not a provider identifier
    partner:
      type: string
    product:
      type: string
      enum: [flight, stay, activity, transfer, car, esim, insurance]
    title:
      type: string
    price:
      $ref: './money.yaml'
    originalPrice:
      $ref: './money.yaml'
    available:
      type: boolean
    cancellationSummary:
      type: string
    freshness:
      $ref: '#/OfferFreshness'
    observedAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    reasons:
      type: array
      maxItems: 8
      items:
        type: string
        enum: [best_price, shortest_trip, fewer_stops, best_location, within_budget, flexible_cancellation, fits_itinerary, highly_rated]
    rank:
      type: integer
      minimum: 1
FlightOffer:
  type: object
  additionalProperties: false
  required: [id, partner, product, title, price, available, freshness, observedAt, reasons, rank, stops, durationMinutes]
  properties:
    id:
      type: string
      description: Opaque NUVRO offer reference, not a provider identifier
    partner:
      type: string
    product:
      type: string
      enum: [flight, stay, activity, transfer, car, esim, insurance]
    title:
      type: string
    price:
      $ref: './money.yaml'
    originalPrice:
