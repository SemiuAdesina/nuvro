    available:
      type: boolean
    cancellationSummary:
      type: string
    freshness:
      $ref: '#/OfferFreshness'
    observedAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
    reasons:
      type: array
      maxItems: 8
      items:
        type: string
        enum: [best_price, shortest_trip, fewer_stops, best_location, within_budget, flexible_cancellation, fits_itinerary, highly_rated]
    rank:
      type: integer
      minimum: 1
    stops:
      type: integer
      minimum: 0
    durationMinutes:
      type: integer
      minimum: 1
    layoverMinutes:
      type: integer
      minimum: 0
    departAt:
      type: string
      format: date-time
    arriveAt:
      type: string
      format: date-time
    carrier:
      type: string
