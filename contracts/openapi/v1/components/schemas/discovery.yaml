MatchRequest:
  type: object
  additionalProperties: false
  required: [budget, startDate, endDate, adults]
  description: >-
    Trip-specific request. Persistent traveller context comes from the authenticated
    profile; the optional fields here override it for this request only.
  properties:
    budget:
      $ref: './money.yaml'
    startDate:
      type: string
      format: date
    endDate:
      type: string
      format: date
    adults:
      type: integer
      minimum: 1
      maximum: 20
    children:
      type: integer
      minimum: 0
      maximum: 20
      default: 0
    interests:
      type: array
      maxItems: 50
      items:
        type: string
        minLength: 1
        maxLength: 40
    weather:
      type: string
      enum: [any, warm, mild, cold]
    crowds:
      type: string
      enum: [any, quiet, lively]
    pace:
      type: string
      enum: [relaxed, balanced, packed]
    flightTolerance:
      type: string
      enum: [any, fewer_stops, shortest]
    maxFlightMinutes:
      type: integer
      minimum: 0
      maximum: 2880
    paperwork:
      type: string
      enum: [any, keep_it_simple]
    departureAirport:
      type: string
      pattern: '^[A-Z]{3}$'
    residenceCountry:
      type: string
      pattern: '^[A-Z]{2}$'
    passportCountries:
      type: array
      maxItems: 5
      items:
        type: string
        pattern: '^[A-Z]{2}$'
    residencePermits:
      type: array
      maxItems: 5
      items:
        type: string
        pattern: '^[A-Z]{2}$'
    query:
      type: string
      maxLength: 500
      description: Optional free text; explicit fields above always win
    limit:
      type: integer
      minimum: 1
      maximum: 20
      default: 10
MatchResponse:
  type: object
  additionalProperties: false
  required: [generatedAt, algorithmVersion, rankingVersion, missingContext, recommendations]
  properties:
    generatedAt:
      type: string
      format: date-time
    algorithmVersion:
      type: string
    rankingVersion:
      type: string
    missingContext:
      type: array
      description: Traveller context the profile still needs for a complete assessment
      items:
        type: string
        enum: [passport, residence, departure_airport]
    recommendations:
      type: array
      maxItems: 20
      items:
        $ref: '#/Recommendation'
Recommendation:
  type: object
  additionalProperties: false
  required: [rank, destination, personalMatch, access, affordability, flight, reasons, cautions, summary]
  properties:
    rank:
      type: integer
      minimum: 1
    destination:
      $ref: '#/DestinationSummary'
    personalMatch:
      $ref: '#/PersonalMatch'
    access:
      $ref: '#/Access'
    affordability:
      $ref: '#/Affordability'
    flight:
      $ref: '#/FlightSummary'
    reasons:
      type: array
      maxItems: 20
      items:
        type: string
    cautions:
      type: array
      maxItems: 20
      items:
        type: string
    summary:
      type: string
      maxLength: 400
DestinationSummary:
  type: object
  additionalProperties: false
  required: [id, name, countryCode, timezone, primaryAirport, coordinates]
  properties:
    id:
      type: string
    name:
      type: string
    region:
      type: string
    countryCode:
      type: string
      pattern: '^[A-Z]{2}$'
    timezone:
      type: string
    primaryAirport:
      type: string
      pattern: '^[A-Z]{3}$'
    coordinates:
      $ref: './common.yaml#/GeoPoint'
    media:
      $ref: './media.yaml'
PersonalMatch:
  type: object
  additionalProperties: false
  required: [score, algorithmVersion, components]
  properties:
    score:
      type: integer
      minimum: 0
      maximum: 100
    algorithmVersion:
      type: string
    components:
      type: array
      maxItems: 20
      items:
        $ref: '#/MatchComponent'
MatchComponent:
  type: object
  additionalProperties: false
  required: [key, label, awardedPoints, possiblePoints, assessment, explanation]
  properties:
    key:
      type: string
    label:
      type: string
    awardedPoints:
      type: integer
      minimum: 0
      maximum: 100
    possiblePoints:
      type: integer
      minimum: 0
      maximum: 100
    assessment:
      type: string
      enum: [strong, good, neutral, caution]
    explanation:
      type: string
Access:
  type: object
  additionalProperties: false
  required: [status, entryMode, preparation, transitRisk, confidence, reasons]
  properties:
    status:
      type: string
      enum: [easy, manageable, preparation_required, not_feasible, unknown]
    entryMode:
      type: string
      enum: [visa_free, eta, evisa, visa_on_arrival, visa_required, unknown]
    preparation:
      type: string
      enum: [none, low, medium, high, unknown]
    transitRisk:
      type: string
      enum: [none, review_required, unknown]
    confidence:
      $ref: '#/Confidence'
    reasons:
      type: array
      maxItems: 10
      items:
        type: string
    sourceLabel:
      type: string
    observedAt:
      type: string
      format: date-time
Affordability:
  type: object
  additionalProperties: false
  required: [status, budget, confidence]
  properties:
    status:
      type: string
      enum: [strong_fit, good_fit, tight, over_budget, insufficient_evidence]
    budget:
      $ref: './money.yaml'
    estimatedTrip:
      $ref: '#/CostRange'
    conversion:
      $ref: '#/Conversion'
    confidence:
      $ref: '#/Confidence'
    observedAt:
      type: string
      format: date-time
CostRange:
  type: object
  additionalProperties: false
  required: [minimum, expected, maximum]
  properties:
    minimum:
      $ref: './money.yaml'
    expected:
      $ref: './money.yaml'
    maximum:
      $ref: './money.yaml'
Conversion:
  type: object
  additionalProperties: false
  required: [original, reference, rateMicros, source, observedAt]
  description: Provenance for a cost estimate converted into the traveller's currency
  properties:
    original:
      $ref: './money.yaml'
    reference:
      $ref: './money.yaml'
    rateMicros:
      type: integer
      format: int64
      minimum: 1
    source:
      type: string
    observedAt:
      type: string
      format: date-time
FlightSummary:
  type: object
  additionalProperties: false
  required: [status, confidence]
  properties:
    status:
      type: string
      enum: [available, unavailable, unknown]
    stops:
      type: integer
      minimum: 0
    durationMinutes:
      type: integer
      minimum: 0
    estimatedPrice:
      $ref: './money.yaml'
    confidence:
      $ref: '#/Confidence'
    observedAt:
      type: string
      format: date-time
Confidence:
  type: string
  enum: [high, medium, low, unknown]
