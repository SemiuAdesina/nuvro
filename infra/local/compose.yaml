name: nuvro-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: nuvro-postgres
    environment:
      POSTGRES_USER: nuvro
      POSTGRES_PASSWORD: nuvro
      POSTGRES_DB: nuvro
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvro -d nuvro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: nuvro-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
